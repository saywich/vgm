[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vertical-generation-messenger"
version = "0.1.0"
description = "A messenger for sharing vertical videos across platforms."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.1",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "blinker==1.9.0",
    "certifi==2026.10.23",
    "click==8.5.0",
    "Flask==3.1.3",
    "googleapis-common-protos==1.76.0",
    "grpcio==1.85.0",
    "grpcio-health-checking==1.85.0",
    "grpcio-tools==1.85.0",
    "gunicorn==23.0.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.20",
    "itsdangerous==2.2.0",
    "Jinja2==3.1.6",
    "Mako==1.4.3",
    "MarkupSafe==3.0.4",
    "opentelemetry-api==1.45.1",
    "opentelemetry-exporter-otlp-common==0.66b1",
    "opentelemetry-exporter-otlp-proto-common==1.45.1",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.1",
    "opentelemetry-instrumentation==0.66b1",
    "opentelemetry-instrumentation-flask==0.66b1",
    "opentelemetry-instrumentation-grpc==0.66b1",
    "opentelemetry-instrumentation-wsgi==0.66b1",
    "opentelemetry-proto==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-semantic-conventions==0.66b1",
    "opentelemetry-util-http==0.66b1",
    "packaging==26.3",
    "prometheus-client==0.26.0",
    "protobuf==7.36.2",
    "psycopg[binary,pool]==3.3.6",
    "psycopg-binary==3.3.6",
    "psycopg-pool==3.3.3",
    "pydantic==2.14.1",
    "pydantic-core==2.50.1",
    "setuptools==84.2.1",
    "SQLAlchemy==2.1.6",
    "typing-inspection==0.4.4",
    "typing-extensions==4.16.0",
    "Werkzeug==3.1.9",
    "wrapt==2.5.1",
]

[project.optional-dependencies]
dev = [
    "iniconfig==2.3.1",
    "isort==6.0.1",
    "pluggy==1.7.0",
    "Pygments==2.21.0",
    "pytest==8.4.2",
    "yapf==0.43.0",
]

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["vgm*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = [
    "integration: requires a dedicated TEST_DATABASE_URL PostgreSQL database",
]

[tool.isort]
profile = "google"
line_length = 80
src_paths = ["backend"]
skip_glob = ["**/generated/*"]

[tool.yapf]
based_on_style = "google"
column_limit = 80
indent_width = 4
dedent_closing_brackets = true
