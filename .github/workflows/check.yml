name: Verify MVP
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vgm
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vgm_test
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U vgm -d vgm_test" --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: pyproject.toml}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -e '.[dev]'
      - run: make check-format
      - run: sh scripts/generate-proto.sh
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql://vgm:test@localhost:5432/vgm_test
      - run: npm ci && npm run build
        working-directory: frontend
      - run: docker compose config --quiet
